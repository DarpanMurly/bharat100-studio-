name: Mastodon self-heal

# Mastodon supports native scheduling (unlike Bluesky — see
# bluesky-schedule.yml for that workaround), so this workflow is NOT a
# per-slot poster. It's a periodic sweep that catches Mastodon statuses
# which were recorded as posted/scheduled in a card.json but later
# disappeared from the account (confirmed real, 2026-09-18: 11 statuses
# across Sept 10-13 vanished after being recorded). See
# pipeline/heal-mastodon.mjs for the full detection logic — it checks
# each recorded mastodonStatusId against the account's full paginated
# status history AND its scheduled_statuses, and only re-posts a card
# whose status is genuinely missing from both.
#
# Runs every 6 hours — frequent enough to catch a gap same-day, not so
# frequent it risks tripping over Mastodon's own eventual-consistency
# lag on a status that was JUST scheduled or JUST posted (the script's
# own scheduled_statuses check plus the mastodonScheduledAt-in-future
# guard already defends against that; see heal-mastodon.mjs's fix
# history — a first live run without that guard falsely re-posted a card
# whose slot hadn't happened yet, creating a real duplicate).

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal-mastodon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check recorded Mastodon statuses and re-post any that are missing
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_ANALYTICS_TOKEN: ${{ secrets.MASTODON_ANALYTICS_TOKEN }}
        run: node pipeline/heal-mastodon.mjs

      - name: Commit updated card.json if changed
        # Same pull --rebase pattern as bluesky-schedule.yml — this
        # workflow and others touch content-queue/ around similar times.
        run: |
          git config user.name "bharat100-bot"
          git config user.email "actions@github.com"
          git add content-queue/
          git diff --cached --quiet || git commit -m "Mastodon heal: record re-posted status [skip ci]"
          git pull --rebase origin main
          git push
