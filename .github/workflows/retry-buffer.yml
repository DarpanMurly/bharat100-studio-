name: Retry failed Buffer posts

# Buffer's free-tier 10-scheduled-post-per-channel cap, combined with
# occasional genuine publish errors (a media-spec issue, Buffer's own
# "unknown error"), means a card can end up missing one or more of its
# Instagram/Threads/X posts. Until this workflow existed, recovering from
# that was entirely manual: someone had to notice an error email, report
# it, and a person had to run a one-off delete+requeue script by hand.
# Real incident 2026-09-13 that prompted this: the user pointed out that
# a failed post SHOULD post automatically as soon as a slot frees up, and
# that the lack of any such tracking is itself the underlying gap — this
# workflow is that tracking + auto-recovery, running on a schedule instead
# of waiting for a human to notice and ask.
#
# CADENCE, per explicit user correction 2026-09-13 ("why are you checking
# every 30 minutes, after a post is due to go live, we only need to check
# once if it is live or not on all channels and take action accordingly"):
# a blanket every-30-minutes sweep was overkill — publish attempts happen
# at each pillar's own slot time, so a check tied to those same 5 slots
# (offset a few minutes later, giving Buffer's own scheduled attempt time
# to actually fire and error out first) covers the real failure window
# without extra polling. If a gap is still capacity-blocked at that single
# check, it's picked up again at the NEXT day's own slot-time check for
# that same pillar — no active retry loop in between, matching the user's
# explicit choice of "check once per slot time only, no follow-up."
#
# pipeline/retry-failed-buffer.mjs does the actual work: finds any card
# with status "approved" (the exact state a partial Buffer failure leaves
# a card in, per publish-to-buffer.mjs's 2026-09-14 resilience fix) whose
# date is within the last 3 days, checks live Buffer capacity per channel,
# and retries whichever gapped platforms now have room. Explicitly does
# NOT touch anything with status "posted"/"scheduled" (already fully
# succeeded, or succeeded through a path this workflow has no business
# overriding) or anything older than 3 days (a gap that old belongs in
# front of a human, not silently auto-fired).
#
# Same IST -> UTC slot times as bluesky-schedule.yml, offset +10 minutes
# so Buffer's own scheduled attempt has already fired (and possibly
# errored) by the time this runs:
#   Global Bharat        23:40 UTC (10 min after the 23:30 slot)
#   Personal Growth       02:40 UTC
#   Builder Story         07:40 UTC
#   Sector Futures        13:40 UTC
#   Diaspora Dividend     17:10 UTC

on:
  schedule:
    - cron: "40 23 * * *"  # Global Bharat
    - cron: "40 2 * * *"   # Personal Growth
    - cron: "40 7 * * *"   # Builder Story
    - cron: "40 13 * * *"  # Sector Futures
    - cron: "10 17 * * *"  # Diaspora Dividend
  workflow_dispatch: {}    # allows a manual "Run workflow" trigger for testing

permissions:
  contents: write

jobs:
  retry-buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Retry any Buffer platform gap that now has capacity
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_INSTAGRAM }}
          BUFFER_CHANNEL_THREADS: ${{ secrets.BUFFER_CHANNEL_THREADS }}
          BUFFER_CHANNEL_TWITTER: ${{ secrets.BUFFER_CHANNEL_TWITTER }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node pipeline/retry-failed-buffer.mjs

      - name: Commit updated card.json if changed
        # Same pull --rebase pattern as bluesky-schedule.yml/facebook-first-
        # comment.yml — multiple workflows can push to content-queue/
        # within minutes of each other.
        run: |
          git config user.name "bharat100-bot"
          git config user.email "actions@github.com"
          git add content-queue/
          git diff --cached --quiet || git commit -m "Retry Buffer: record recovered post id(s) [skip ci]"
          git pull --rebase origin main
          git push
