name: Weekly housekeeping

# Runs the full suite of detection-only health checks once a week, per
# an explicit user request (2026-09-20): the project is built for a
# 20-year horizon, so drift of any kind needs to surface on a forced,
# regular cadence rather than only when someone happens to notice or
# ask. This keeps any repair "at most a few days old" (the user's own
# stated goal) without repeating the Buffer API rate-limit incident
# from 2026-09-19/20 (see pages-deploy.yml's own history) — weekly
# keeps total external API call volume low, unlike folding this into
# the existing daily deploy job.
#
# This workflow only DETECTS and reports — it changes nothing in the
# CONTENT sense (no post is made, no card is edited). The one exception
# is content-queue/.housekeeping-state.json, a small marker file the
# script itself maintains to make each run after the first INCREMENTAL
# (only re-scanning back to the last run, not the full history every
# single week forever) — see weekly-housekeeping.mjs's own header. That
# marker must be committed back here, since a GitHub Actions runner is
# thrown away after the job ends and would otherwise "forget" every run
# ever happened, making every run a full-history run again.
on:
  schedule:
    - cron: "0 3 * * 0"  # 08:30 IST Sunday — after the weekly recap's own Sunday cadence has had time to land
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Build archive data
        # content-queue/archive-data.json is gitignored (a generated
        # build artifact, normally produced locally by deploy-
        # homepage.mjs) — a fresh CI checkout never has it. Without this
        # step, check-website-accuracy.mjs crashes with ENOENT trying to
        # read it (found 2026-09-20, first real run of this workflow:
        # every other check came back genuinely clean, but this one
        # never actually ran at all — it just crashed before doing any
        # checking, which is a different thing from "found an issue").
        run: node pipeline/build-archive-data.mjs

      - name: Run full housekeeping suite
        # continue-on-error so the state-file commit below still happens
        # even when a real finding makes this step exit non-zero — the
        # run should still be marked red for visibility (see the final
        # step), but a genuine finding must never prevent next week's
        # run from being properly incremental.
        id: housekeeping
        continue-on-error: true
        run: node pipeline/weekly-housekeeping.mjs

      - name: Commit updated housekeeping state
        run: |
          git config user.name "bharat100-bot"
          git config user.email "actions@github.com"
          git add content-queue/.housekeeping-state.json
          git diff --cached --quiet || git commit -m "Weekly housekeeping: record run date [skip ci]"
          git pull --rebase origin main
          git push

      - name: Fail the run if housekeeping found something
        # Deliberately last — the state has already been committed by
        # this point regardless of findings. This only marks the run red
        # in the Actions tab so a real finding is actually noticed.
        if: steps.housekeeping.outcome == 'failure'
        run: |
          echo "Weekly housekeeping found one or more issues — see the 'Run full housekeeping suite' step's log above for details."
          exit 1
