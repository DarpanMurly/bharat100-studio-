name: Homepage sync

# Keeps bharatat100.com's archive and platform links in sync with what's
# actually live, by re-running the full homepage build after every slot
# fires (not just once a day at approval time) — approval-time scheduling
# means a freshly-approved post's slot hasn't happened yet, so
# build-archive-data.mjs (which only includes a post once its own slot
# instant is in the past) would skip it if this ran then instead.
#
# Runs shortly after each slot instant (not exactly on it) to give the
# Buffer/YouTube/Facebook/Mastodon publish (which fires at the slot time
# itself, either from Buffer's own queue or the local approval-time
# schedule) a few minutes to actually land before the archive is rebuilt.
#
# IST -> UTC conversions (IST is UTC+5:30), matching pipeline/slots.mjs:
#   Global Bharat        5:00 IST  -> 23:30 UTC (prev day) -> run 23:40 UTC
#                                     (moved from 6:00 IST on 2026-09-09)
#   Personal Growth       8:00 IST  -> 02:30 UTC  -> run 02:40 UTC
#   Builder Story        13:00 IST  -> 07:30 UTC  -> run 07:40 UTC
#   Sector Futures        19:00 IST  -> 13:30 UTC  -> run 13:40 UTC
#   Weekly Recap          21:00 IST  -> 15:30 UTC  -> run 15:40 UTC
#   Diaspora Dividend     22:30 IST  -> 17:00 UTC  -> run 17:10 UTC

# PAUSED 2026-09-10: user is out of Netlify build credits. Running out of
# credits doesn't just fail future deploys — it takes the ENTIRE live site
# offline (a "Site not available" page) until the next monthly reset. This
# workflow deploys up to 6x/day, which risked burning through credits fast.
# All 6 scheduled cron triggers commented out below; workflow_dispatch (the
# manual "Run workflow" button) is left enabled so a deploy can still be
# triggered deliberately once credits are sorted out. To re-enable the
# automatic schedule, uncomment the "schedule:" block below.
on:
  # schedule:
  #   - cron: "40 23 * * *"  # after Global Bharat
  #   - cron: "40 2 * * *"   # after Personal Growth
  #   - cron: "40 7 * * *"   # after Builder Story
  #   - cron: "40 13 * * *"  # after Sector Futures
  #   - cron: "40 15 * * *"  # after Weekly Recap (when it runs)
  #   - cron: "10 17 * * *"  # after Diaspora Dividend
  workflow_dispatch: {}    # manual "Run workflow" trigger — still enabled

# Needs write access for the same reason as bluesky-schedule.yml: the
# default GITHUB_TOKEN is read-only, and this workflow's whole job is to
# commit + push the rebuilt homepage — see feedback_github_actions_permissions.
permissions:
  contents: write

jobs:
  sync-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Rebuild and deploy homepage if anything changed
        run: |
          git config user.name "bharat100-bot"
          git config user.email "actions@github.com"
          node pipeline/deploy-homepage.mjs
