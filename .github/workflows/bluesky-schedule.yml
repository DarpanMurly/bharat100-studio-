name: Bluesky scheduled posting

# Bluesky's API has no native "schedule for later" — every post goes live
# the instant the API call is made. Every other platform in this pipeline
# (Buffer, YouTube, Facebook) supports queuing a post for a future slot
# time; this workflow is the workaround for Bluesky specifically — it
# fires a real job at each pillar's exact IST slot time (converted to
# UTC below), independent of any local machine being on, so Bluesky
# posts land at the same instant as everything else instead of bursting
# all 5 out together at approval time.
#
# IST -> UTC conversions (IST is UTC+5:30), matching pipeline/slots.mjs:
#   Global Bharat        5:00 IST  -> 23:30 UTC (previous day; moved from
#                                     6:00 IST on 2026-09-09 — only a
#                                     2-hour gap to the 8:00 IST slot,
#                                     tight next to the day's other 5-6
#                                     hour gaps)
#   Personal Growth       8:00 IST  -> 02:30 UTC
#   Builder Story        13:00 IST  -> 07:30 UTC
#   Sector Futures        19:00 IST  -> 13:30 UTC
#   Weekly Recap          21:00 IST  -> 15:30 UTC (added 2026-09-21 — was
#                                     previously excluded from the slot
#                                     runner entirely with no firing of
#                                     its own, so all 3 weekly recaps to
#                                     date, Sept 7/14/21, never posted to
#                                     Bluesky at all; not a timing bug,
#                                     a missing pillar)
#   Diaspora Dividend    22:30 IST  -> 17:00 UTC
#
# Extra half-hourly check-ins added 2026-09-21: GitHub's own cron
# scheduler was found to delay a firing well past the documented
# "10-60+ minutes late" — confirmed directly via run history that the
# 13:30 UTC Sector Futures firing didn't actually run until 16:38 UTC,
# a 3h08m gap, because the NEXT scheduled trigger (17:00, Diaspora
# Dividend) was itself the first one to fire again after 12:00. Since
# the slot runner already self-heals (every firing checks ALL pillars
# and posts whatever's overdue, not just "its own" pillar), the fix
# isn't more precise timing — it's simply checking in more often so a
# delayed exact-slot firing gets caught by the NEXT check-in sooner.
# These extra `:00` firings are redundant with the exact-slot ones
# above on a good day (nothing to do, exits fast) and are the safety
# net on a bad one.
on:
  schedule:
    - cron: "30 23 * * *"  # Global Bharat (exact slot)
    - cron: "0 0 * * *"    # extra check-in
    - cron: "0 1 * * *"    # extra check-in
    - cron: "30 2 * * *"   # Personal Growth (motivational-short) (exact slot)
    - cron: "0 3 * * *"    # extra check-in
    - cron: "0 4 * * *"    # extra check-in
    - cron: "0 5 * * *"    # extra check-in
    - cron: "0 6 * * *"    # extra check-in
    - cron: "30 7 * * *"   # Builder Story (on-this-day-short) (exact slot)
    - cron: "0 8 * * *"    # extra check-in
    - cron: "0 9 * * *"    # extra check-in
    - cron: "0 10 * * *"   # extra check-in
    - cron: "0 11 * * *"   # extra check-in
    - cron: "0 12 * * *"   # extra check-in
    - cron: "30 13 * * *"  # Sector Futures (exact slot)
    - cron: "0 14 * * *"   # extra check-in
    - cron: "30 15 * * *"  # Weekly Recap (exact slot)
    - cron: "0 16 * * *"   # extra check-in
    - cron: "0 17 * * *"   # Diaspora Dividend (exact slot)
    - cron: "0 18 * * *"   # extra check-in
    - cron: "0 19 * * *"   # extra check-in
    - cron: "0 20 * * *"   # extra check-in
    - cron: "0 21 * * *"   # extra check-in
    - cron: "0 22 * * *"   # extra check-in
  workflow_dispatch:       # manual trigger, also usable for a one-off card
    inputs:
      card_id:
        description: "Optional: <date>_<id> to publish directly via bluesky-publish.mjs, bypassing the slot runner's lookback window (for a gap found older than its normal catch-up range)"
        required: false
        type: string
      delete_uri:
        description: "Optional one-off cleanup: an at:// post URI to delete instead of publishing anything (e.g. removing an accidental duplicate). Takes priority over card_id if both are set."
        required: false
        type: string

# The default GITHUB_TOKEN is read-only unless explicitly granted write
# access — the final "git push" step (recording each post's URI/timestamp
# back to card.json) needs this, or it fails with exit code 128
# (confirmed as the real cause of the first run's failure, 2026-09-09 —
# not a Bluesky API problem at all, a git-push-permission problem).
permissions:
  contents: write

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check all 6 pillars and post whichever are due
        # No more wall-clock pillar-guessing (removed 2026-09-10) — GitHub
        # Actions schedule triggers are documented to fire 10-60+ minutes
        # late under normal load, and matching a narrow time window per
        # pillar meant a late firing silently posted the WRONG pillar's
        # content (confirmed: a 10-minute-late firing on 2026-09-10 posted
        # Sector Futures' post at Personal Growth's slot time, and the
        # other 4 pillars never posted that day at all). The slot runner
        # now checks every pillar's real slot instant against actual
        # current time itself — self-healing against delay of any length.
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ -n "${{ inputs.delete_uri }}" ]; then
            node pipeline/bluesky-delete-post.mjs "${{ inputs.delete_uri }}"
          elif [ -n "${{ inputs.card_id }}" ]; then
            node pipeline/bluesky-publish.mjs "${{ inputs.card_id }}"
          else
            node pipeline/bluesky-slot-runner.mjs
          fi

      - name: Commit updated card.json if changed
        # This workflow, homepage-sync.yml, and facebook-first-comment.yml
        # all push to main within minutes of each other around the same
        # slot times, and two of them touch content-queue/ for the same
        # card — pull --rebase before pushing so a push landing in that
        # window doesn't fail this one with a non-fast-forward rejection
        # (found via a full pipeline audit, 2026-09-10).
        run: |
          git config user.name "bharat100-bot"
          git config user.email "actions@github.com"
          git add content-queue/
          git diff --cached --quiet || git commit -m "Bluesky: record post URI/timestamp [skip ci]"
          git pull --rebase origin main
          git push
