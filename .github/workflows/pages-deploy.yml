name: Deploy homepage to GitHub Pages

# Replaces the old Netlify auto-deploy (paused 2026-09-10 after exhausting
# Netlify's free build credits — running out of credits took the whole
# site offline, not just future deploys). GitHub Pages has no credit or
# usage-based billing at all, so this workflow can run daily with zero
# risk of the site going down from overuse.
#
# Runs once a day, at the end of the day (matches the user's own stated
# daily-refresh plan) — rebuilds the archive from whatever's published so
# far, then deploys netlify-deploy/ (kept as the publish-folder name for
# continuity with build-homepage.mjs/deploy-homepage.mjs, even though it's
# no longer Netlify-specific) straight to GitHub Pages.
on:
  schedule:
    - cron: "30 18 * * *"  # 00:00 IST (midnight) — end of day
  workflow_dispatch: {}    # manual "Run workflow" trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sync Instagram/Threads post links from Buffer
        # Buffer's own post id isn't a public URL — this pulls the real
        # permalink (externalLink) for every sent post so the archive can
        # link out to the actual live Instagram/Threads post, not just
        # YouTube (added 2026-09-17, see build-archive-data.mjs's
        # platformLinks and this script's own header for why).
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_INSTAGRAM }}
          BUFFER_CHANNEL_THREADS: ${{ secrets.BUFFER_CHANNEL_THREADS }}
        run: node pipeline/sync-buffer-links.mjs

      - name: Rebuild homepage archive
        run: |
          git config user.name "bharat100-bot"
          git config user.email "actions@github.com"
          git add content-queue/
          git diff --cached --quiet || git commit -m "Sync Buffer post links [skip ci]"
          node pipeline/deploy-homepage.mjs

      - name: Check cross-platform coverage (last 4 days)
        # Runs every night alongside the homepage refresh so a missed post
        # on ANY of the 8 platforms (or a missing WordPress digest) shows up
        # as a failed run in the Actions tab within a day, instead of only
        # being found when someone happens to ask about it directly (see
        # feedback_daily_cycle_automation and feedback_wordpress_digest_
        # manual_gap memories — both the Bluesky and WordPress incidents
        # this was built for went unnoticed for days). Exits non-zero on a
        # real gap, which fails this step and the whole run — check
        # `gh run list --workflow=pages-deploy.yml` or the repo's Actions
        # tab to see it. Does NOT block the deploy steps below it (the
        # homepage should still update even if a gap is found) — see the
        # `continue-on-error` + explicit final check below.
        id: coverage
        continue-on-error: true
        run: node pipeline/check-platform-coverage.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: netlify-deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site matches archive data
        # Post-deploy check, not pre-deploy — confirms the site ACTUALLY
        # serves what was just deployed, not just that the deploy step
        # itself reported success. Catches a stale CDN edge, a broken
        # build, or a deploy that silently didn't pick up the latest
        # archive-data.json. See check-website-accuracy.mjs's header.
        id: accuracy
        continue-on-error: true
        run: node pipeline/check-website-accuracy.mjs

      - name: Fail the run if a coverage gap was found
        # Deliberately the LAST step — the homepage has already deployed
        # by this point regardless of coverage result. This only makes the
        # overall workflow run show red in the Actions tab/gh run list, so
        # a gap is visible without blocking the one thing (site freshness)
        # that matters even on a day something else is broken.
        if: steps.coverage.outcome == 'failure'
        run: |
          echo "Cross-platform coverage check found a gap — see the 'Check cross-platform coverage' step's log above for details."
          exit 1

      - name: Fail the run if a website accuracy mismatch was found
        if: steps.accuracy.outcome == 'failure'
        run: |
          echo "Website accuracy check found a mismatch — see the 'Verify live site matches archive data' step's log above for details."
          exit 1
